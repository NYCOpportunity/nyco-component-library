name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - dev
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run so the latest wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Single job: build + deploy in one runner so the OIDC token stays valid
  # between building and deploying (avoids "Invalid actions OIDC token").
  deploy:
    name: Build and Deploy Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Storybook
        run: pnpm run build:storybook

      # Preserve custom domain on every deploy (skips gracefully if CNAME absent)
      - name: Copy CNAME
        run: cp CNAME storybook-static/CNAME
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
